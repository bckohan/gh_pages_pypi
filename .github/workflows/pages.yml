# Regenerates the PEP 503 package index from GitHub release assets and
# deploys it to GitHub Pages. Runs on releases (created or deleted by hand),
# on any push to main (e.g. to pick up index script changes), on manual
# dispatch, and is triggered explicitly by demo-release.yml (releases created
# with GITHUB_TOKEN do not fire `release` events).
#
# NOTE: this fails by design while the repository has no releases yet —
# gh-pages-pypi refuses to deploy an empty index.
name: pages

on:
  release:
    types: [published, deleted]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {} # no default permissions; each job declares only what it needs

# Latest-wins: a newer index build supersedes an in-flight one. (GitHub's
# Pages starter uses cancel-in-progress: false to protect production
# deploys; for an index rebuilt from scratch each run, newest data wins.)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the repo and release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: false

      # Runs the gh-pages-pypi CLI from this repo's own source — the repo
      # dogfoods the tool it publishes. Other repos would use:
      #   uvx gh-pages-pypi "$GITHUB_REPOSITORY" --out site
      - name: Build the package index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --no-default-groups gh-pages-pypi "$GITHUB_REPOSITORY" --out site

      # Fails fast with a clear error if Pages isn't enabled for this repo.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy the built site to GitHub Pages
      id-token: write # required to authenticate the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
