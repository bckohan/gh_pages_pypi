[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghr-pypi-demo-app"
dynamic = ["version"]
description = "Tiny CLI demonstrating dependency resolution from a GitHub Pages PyPI index"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC0-1.0" }
dependencies = ["ghr-pypi-demo-lib>=1.0.0"]

[project.scripts]
demo-app = "ghr_pypi_demo_app:main"

[project.urls]
Repository = "https://github.com/bckohan/ghr-pypi"

[tool.hatch.version]
source = "code"
path = "src/ghr_pypi_demo_app/_version.py"
expression = "get_version()"

[tool.hatch.build.targets.wheel]
packages = ["src/ghr_pypi_demo_app"]
