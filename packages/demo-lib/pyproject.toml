[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghr-pypi-demo-lib"
dynamic = ["version"]
description = "Tiny greeting library demonstrating GitHub Pages as a PyPI index"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC0-1.0" }

[project.urls]
Repository = "https://github.com/bckohan/ghr-pypi"

[tool.hatch.version]
source = "code"
path = "src/ghr_pypi_demo_lib/_version.py"
expression = "get_version()"

[tool.hatch.build.targets.wheel]
packages = ["src/ghr_pypi_demo_lib"]
